<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nobel overview — Avenir</title>
<style>
*{box-sizing:border-box}
:root{--graphic-font:Avenir,'Trebuchet MS',sans-serif}
html,body{height:100%}
body{margin:0;background:#fff;color:#222;font-family:var(--graphic-font);display:flex;flex-direction:column;overflow:hidden}

header{flex:none;display:flex;align-items:baseline;justify-content:center;gap:12px;padding:20px 24px 4px}
.count{font:400 40px var(--graphic-font);letter-spacing:-2px;line-height:1}
.count-label{font:400 13px var(--graphic-font);color:#666}
.legend{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;padding:6px 24px 0;font:400 11px var(--graphic-font);color:#666}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--accent)}

.stage{position:relative;flex:1;min-height:0;margin:0 auto;width:100%;max-width:1600px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.axis-line{stroke:#aca9a2;stroke-width:2}
.tick{stroke:#aca9a2;stroke-width:1}
.tick-label{font:400 10px var(--graphic-font);fill:#969696;text-anchor:middle}
.stem{fill:none;stroke:#d8d6d2;stroke-width:1;transition:stroke .2s,stroke-width .2s}
.stem.hl{stroke:var(--accent);stroke-width:2}

.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--accent,#222);box-shadow:0 0 0 1px var(--accent,#222);cursor:pointer;z-index:2;transition:transform .2s}
.dot.hl,.dot:focus-visible{transform:scale(1.6);outline:none}

.mini{position:absolute;display:flex;flex-direction:column;padding:0;font:inherit;color:inherit;text-align:left;background:var(--tint,#f4f3f1);border:0;border-top:2px solid var(--accent,#aca9a2);cursor:pointer;z-index:1;transition:transform .2s ease,box-shadow .2s ease}
.mini.hl,.mini:focus-visible{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 20px rgba(0,0,0,.12);outline:none;z-index:3}
.mini .photo{width:100%;aspect-ratio:1}
.mini-body{padding:4px 6px 5px;min-width:0}
.mini .name{font:400 11px/1.2 var(--graphic-font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .year{font-size:9px}

.photo{overflow:hidden;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#969696;font:400 18px var(--graphic-font)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.year{font:400 11px var(--graphic-font);color:var(--accent,#666);letter-spacing:.08em;text-transform:uppercase}
.lab{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:3px 9px 3px 4px;border:1px solid #aca9a2;border-radius:999px;background:rgba(255,255,255,.7);font:400 10px var(--graphic-font);letter-spacing:.06em;text-transform:uppercase;color:#444}
.lab svg{width:16px;height:16px;flex:none;color:var(--accent,#666)}

dialog{width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-top:4px solid var(--accent,#aca9a2);background:var(--tint,#fff);color:#222;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(255,255,255,.75);backdrop-filter:blur(3px)}
dialog[open]{animation:open .35s cubic-bezier(.2,.8,.2,1)}
dialog.closing{animation:close .2s ease forwards}
@keyframes open{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes close{to{opacity:0;transform:scale(.92)}}
.detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.detail .photo{height:100%;min-height:100%;font-size:64px}
.detail-text{padding:36px 36px 32px}
.detail .name{font:400 clamp(26px,3.4vw,38px)/1.15 var(--graphic-font);margin:6px 0 14px}
.blurb{font:400 14px/1.65 var(--graphic-font);color:#444;margin:18px 0 0;padding:20px 22px;background:rgba(255,255,255,.7);border:1px solid #aca9a2;border-left:3px solid var(--accent,#aca9a2)}
.together{font:400 14px/1.6 var(--graphic-font);margin:16px 0 0;padding:14px 18px;border:1px solid var(--accent,#aca9a2);background:rgba(255,255,255,.5)}
.together b{font-weight:600}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.85);font:400 22px/1 var(--graphic-font);color:#444;cursor:pointer;z-index:1}
.close:hover{background:#fff}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.pager button{font:400 12px var(--graphic-font);color:#444;background:none;border:0;padding:6px 0;cursor:pointer;letter-spacing:.04em}
.pager button:hover{color:#222;text-decoration:underline}
.pager button:disabled{visibility:hidden}

body.vertical{overflow:auto;display:block}
body.vertical .stage{height:auto;padding:16px 16px 40px 44px}
body.vertical .stage svg,body.vertical .dot{display:none}
body.vertical .stage::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:#aca9a2}
body.vertical .mini{position:relative;flex-direction:row;align-items:center;width:100%;margin:0 0 10px;left:auto!important;top:auto!important;width:auto!important}
body.vertical .mini::before{content:"";position:absolute;left:-26px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid #fff;background:var(--accent);box-shadow:0 0 0 1px var(--accent)}
body.vertical .mini .photo{width:56px;flex:none}
body.vertical .mini-body{padding:6px 12px}
body.vertical .mini .name{font-size:15px}
body.vertical .mini .year{font-size:10px}
@media(max-width:700px){
 .detail{grid-template-columns:1fr}
 .detail .photo{aspect-ratio:1;height:auto}
 .detail-text{padding:24px 20px}
}
@media(prefers-reduced-motion:reduce){dialog[open],dialog.closing{animation:none}.mini,.dot,.stem{transition:none}}
</style>
</head><body>
<header>
 <div class="count"></div>
 <div class="count-label">Berkeley Nobel laureates · click a dot or card to open it</div>
</header>
<div class="legend"></div>
<div class="stage"><svg aria-hidden="true"></svg></div>
<dialog aria-labelledby="detail-name">
 <button class="close" aria-label="Close">×</button>
 <div class="detail"></div>
</dialog>
<script src="timeline-data.js"></script>
<script>
(()=>{
const data=window.timelineData,ns='http://www.w3.org/2000/svg';
const colors={'Physics':'#50798e','Chemistry':'#c29246','Economics':'#9783a1','Physiology or Medicine':'#6f9484','Literature':'#b16f72'};
const tints={'Physics':'#e3ecf0','Chemistry':'#f5ecdf','Economics':'#ece8ef','Physiology or Medicine':'#e5eee9','Literature':'#f3e6e6'};
const LAB_NAME='Lawrence Livermore Lab';
const atom='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/></svg>';

const h=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const s=(tag,attrs={},text)=>{const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e};
const initials=n=>n.split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const lastName=n=>n.split(/\s+/).pop();
const photoFor=(p,lazy=true)=>{const el=h('div','photo');if(p.photo){const img=h('img');img.src=p.photo;img.alt=p.name;if(lazy)img.loading='lazy';el.append(img)}else el.textContent=initials(p.name);return el};
const labFor=p=>{if(!p.lab)return [];const el=h('span','lab');el.innerHTML=atom;el.append(h('span',null,LAB_NAME));el.title=`Researched at ${LAB_NAME}`;return [el]};
const theme=(el,cat)=>{if(colors[cat])el.style.setProperty('--accent',colors[cat]);if(tints[cat])el.style.setProperty('--tint',tints[cat])};

const people=data.flatMap(d=>d.people.map(p=>({...p,year:d.year,category:d.category,together:d.together,partners:d.people.filter(o=>o!==p).map(o=>o.name)})));
document.querySelector('.count').textContent=people.length;

const legend=document.querySelector('.legend');
[...new Set(people.map(p=>p.category))].forEach(c=>{const sp=h('span');sp.style.setProperty('--accent',colors[c]);sp.append(h('i'),c==='Physiology or Medicine'?'Medicine':c);legend.append(sp)});

const stage=document.querySelector('.stage'),svg=stage.querySelector('svg');
const items=people.map((p,i)=>{
 const dot=h('button','dot'),card=h('button','mini');
 [dot,card].forEach(el=>{theme(el,p.category);el.setAttribute('aria-label',`${p.name}, ${p.year} ${p.category}`);el.addEventListener('click',()=>open(i,el));
  el.addEventListener('mouseenter',()=>hl(i,true));el.addEventListener('mouseleave',()=>hl(i,false));el.addEventListener('focus',()=>hl(i,true));el.addEventListener('blur',()=>hl(i,false))});
 dot.tabIndex=-1;
 const body=h('div','mini-body');body.append(h('div','name',lastName(p.name)),h('div','year',p.year));
 card.title=p.name;card.append(photoFor(p),body);
 stage.append(card,dot);
 return {p,dot,card,stem:null};
});
function hl(i,on){const it=items[i];[it.dot,it.card,it.stem].forEach(el=>el&&el.classList.toggle('hl',on))}

function layout(){
 const vertical=innerWidth<700;document.body.classList.toggle('vertical',vertical);
 svg.replaceChildren();items.forEach(it=>it.stem=null);
 if(vertical)return;
 const W=stage.clientWidth,H=stage.clientHeight,L=36,R=36,ax=Math.round(H/2),span=W-L-R;
 const x=y=>L+(y-1930)/100*span;
 svg.append(s('line',{class:'axis-line',x1:L,x2:W-R,y1:ax,y2:ax}));
 for(let y=1930;y<=2030;y+=10){svg.append(s('line',{class:'tick',x1:x(y),x2:x(y),y1:ax-4,y2:ax+4}));if(y<2030)svg.append(s('text',{class:'tick-label',x:x(y+5),y:ax+16},y+'s'))}

 const byYear={};items.forEach(it=>(byYear[it.p.year]=byYear[it.p.year]||[]).push(it));
 Object.values(byYear).forEach(g=>g.forEach((it,k)=>{it.dx=x(it.p.year)+(k-(g.length-1)/2)*13;it.dot.style.left=it.dx+'px';it.dot.style.top=ax+'px'}));


 const sides=[items.filter((_,i)=>i%2===0),items.filter((_,i)=>i%2===1)];
 const gapToAxis=40,gap=8,maxN=Math.max(...sides.map(a=>a.length)),spacing=span/maxN;
 let tiers=Math.min(3,Math.max(1,Math.ceil(84/spacing))),cw=0;
 for(;tiers<=3;tiers++){cw=Math.min(104,spacing*tiers-gap,(ax-gapToAxis-12)/tiers-gap-30);if(cw>=52||tiers===3)break}
 cw=Math.max(40,Math.floor(cw));const ch=cw+30;
 sides.forEach((list,side)=>{
  const sp=span/list.length;
  list.forEach((it,j)=>{
   const cx=L+(j+.5)*sp,t=j%tiers,top=side===0?ax-gapToAxis-ch-t*(ch+gap):ax+gapToAxis+t*(ch+gap);
   Object.assign(it.card.style,{left:cx-cw/2+'px',top:top+'px',width:cw+'px'});
   const ay=side===0?top+ch:top,bend=side===0?ax-gapToAxis+6:ax+gapToAxis-6,mid=(bend+ax)/2;
   const path=s('path',{class:'stem',d:`M${cx},${ay} L${cx},${bend} C${cx},${mid} ${it.dx},${mid} ${it.dx},${ax}`});
   path.style.setProperty('--accent',colors[it.p.category]);svg.append(path);it.stem=path;
  });
 });
}
new ResizeObserver(layout).observe(stage);addEventListener('resize',layout);layout();
const dialog=document.querySelector('dialog'),detail=dialog.querySelector('.detail');let openIndex=-1,opener=null;
function render(i){
 const p=people[i];openIndex=i;theme(dialog,p.category);
 const text=h('div','detail-text'),name=h('div','name',p.name);name.id='detail-name';
 text.append(h('div','year',`${p.year} · ${p.category}`),name,...labFor(p),h('p','blurb',p.blurb));
 if(p.together){const t=h('p','together');t.append(h('b',null,`With ${p.partners.join(' & ')}. `),p.together);text.append(t)}
 const pager=h('div','pager'),prev=h('button',null,'← Previous'),next=h('button',null,'Next →');
 prev.disabled=i<=0;next.disabled=i>=people.length-1;
 prev.addEventListener('click',()=>render(i-1));next.addEventListener('click',()=>render(i+1));
 pager.append(prev,next);text.append(pager);
 detail.replaceChildren(photoFor(p,false),text);dialog.scrollTop=0;
}
function open(i,el){
 opener=el;render(i);dialog.showModal();
 const r=el.getBoundingClientRect(),d=dialog.getBoundingClientRect();
 dialog.style.transformOrigin=`${r.left+r.width/2-d.left}px ${r.top+r.height/2-d.top}px`;
}
function close(){
 if(!dialog.open||dialog.classList.contains('closing'))return;
 dialog.classList.add('closing');
 const done=()=>{dialog.classList.remove('closing');dialog.close();items[openIndex].card.focus()};
 matchMedia('(prefers-reduced-motion: reduce)').matches?done():dialog.addEventListener('animationend',done,{once:true});
}
dialog.querySelector('.close').addEventListener('click',close);
dialog.addEventListener('cancel',e=>{e.preventDefault();close()});
dialog.addEventListener('click',e=>{if(e.target===dialog)close()});
addEventListener('keydown',e=>{if(!dialog.open)return;
 if(e.key==='ArrowRight'&&openIndex<people.length-1)render(openIndex+1);if(e.key==='ArrowLeft'&&openIndex>0)render(openIndex-1)});
})();
</script></body></html>
