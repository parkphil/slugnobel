<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthplace map — prototype</title>
  <link rel="stylesheet" href="css/map-prototype.css">
  <script defer src="js/vendor/d3.min.js"></script>
  <script defer src="js/vendor/topojson-client.min.js"></script>
  <script defer src="js/map-prototype.js"></script>
</head>
<body>
  <main class="map-component">
    <div class="map-canvas"><svg id="birth-map" viewBox="0 0 1200 640" role="img" aria-label="World map showing 63 Berkeley Nobel laureates grouped by country of birth"></svg></div>
    <p id="map-error" hidden></p>
  </main>
  <aside id="map-tooltip" hidden></aside>
  <dialog id="map-profile"><button class="profile-close" aria-label="Close profile">×</button><div id="profile-content"></div></dialog>
</body>
</html>
